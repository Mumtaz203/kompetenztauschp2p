# Test datasource for @QuarkusTest boot
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/p2p_db
quarkus.datasource.devservices.enabled=false

# Keep test startup lightweight
quarkus.flyway.migrate-at-start=false


# Provide a safe test Gemini API key so CDI can construct the Gemini adapter
embedding.enabled=true
gemini.api.key=test-key

