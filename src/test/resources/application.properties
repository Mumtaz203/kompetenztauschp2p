# Test datasource for @QuarkusTest boot
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/p2p_db?currentSchema=p2p_test
quarkus.datasource.devservices.enabled=false

# Keep tests isolated from the DEV schema and seed. Flyway recreates this test-only schema.
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=p2p_test
quarkus.flyway.clean-at-start=true
quarkus.flyway.migrate-at-start=true


# Provide a safe test Gemini API key so CDI can construct the Gemini adapter
embedding.enabled=true
gemini.api.key=test-key

