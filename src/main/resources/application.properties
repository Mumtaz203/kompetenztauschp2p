# DB
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

app.admin.id=00000000-0000-0000-0000-000000000001
app.admin.username=admin
app.admin.email=admin@kompetenz.de
app.admin.password=admin123

# DEV (local PostgreSQL by default; override with DEV_DATABASE_URL when using Docker on another host port)
%dev.quarkus.datasource.jdbc.url=${DEV_DATABASE_URL:jdbc:postgresql://localhost:5432/p2p_db}

# PROD
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/p2p_db

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:8082,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:8082}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

quarkus.console.enabled=false

# Dev Services are off because this project uses an explicit PostgreSQL URL.
quarkus.datasource.devservices.enabled=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/dev-seed
%prod.quarkus.flyway.locations=db/migration

# Gemini embedding configuration
embedding.enabled=false
gemini.api.key=${GEMINI_API_KEY:}
gemini.embedding.model=gemini-embedding-001
embedding.backfill.enabled=false

# JWT
mp.jwt.verify.issuer=kompetenz-app
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
