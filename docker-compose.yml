version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: p2p-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2p_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: p2p-backend
    depends_on:
      - postgres
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/p2p_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres

      QUARKUS_CONSOLE_ENABLED: "false"
      QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"

    ports:
      - "8081:8080"

volumes:
  pgdata: